spring.application.name=SupplyContractService

# Puerto independiente del microservicio principal (A-B usa 8080)
server.port=8081

# Conexion Oracle - Base de datos INDEPENDIENTE (esquema/usuario propio)
spring.datasource.url=jdbc:oracle:thin:@//192.168.1.7:1521/XE
spring.datasource.username=DAE2026_C
spring.datasource.password=DAE2026_C
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
